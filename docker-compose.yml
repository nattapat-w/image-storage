# Local infrastructure for image-storage (optional — SQLite + local disk still work without this).
#
#   pnpm ollama:up      start Ollama only (auto-tag)
#   pnpm ollama:setup   pull model + create phototagger (first run)
#   pnpm infra:up       start Ollama + MinIO + Postgres
#   pnpm dev:s3         dev with S3 blob storage via MinIO
#
services:
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
  minio-init:
    profiles: ["s3"]
    image: helmforge/mc:1.0.0
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb local/image-storage --ignore-existing;
      exit 0;
      "

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: imagestorage
      POSTGRES_PASSWORD: imagestorage
      POSTGRES_DB: imagestorage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagestorage -d imagestorage"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    # Use 11435 on host — Ollama Desktop often owns 127.0.0.1:11434 on Windows.
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./apps/api/ollama:/modelfiles:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  minio_data:
  postgres_data:
  ollama_data:
